name: CI

# The honesty gate (AUTOPSY B5). The constitution says "it runs ≠ it's done"
# and demands tests+build before a change counts — yet for months nothing
# enforced even that the tree COMPILES. This is the floor: every push and PR
# must build (Go + web), vet clean, and pass the Go tests. Richer golden-path
# smoke (stub render, endpoint checks) layers on top of this later.
#
# Dürüstlük kapısı (AUTOPSY B5). Anayasa "çalışıyor ≠ bitti" der ve bir
# değişiklik sayılmadan önce test+derleme ister — ama aylarca ağacın DERLENDİĞİNİ
# bile hiçbir şey zorlamadı. Bu, taban: her push ve PR derlenmeli (Go + web),
# vet temiz olmalı ve Go testleri geçmeli. Daha zengin golden-path smoke
# (stub render, uç denetimleri) bunun üstüne sonra eklenir.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Turkey is UTC+3 year-round: 20:55 UTC is 23:55 Europe/Istanbul.
  schedule:
    - cron: '55 20 * * *'
  workflow_dispatch:

# A newer PR/main run makes the older result irrelevant. Immutable release-tag
# runs are never cancelled after signing starts.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  actions: read
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  go:
    name: Go — format, build, vet, test
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
      - name: Verify exact Go toolchain
        run: test "$(go env GOVERSION)" = go1.26.5
      - name: Verify Go formatting
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 -r gofmt -l)"
          test -z "$unformatted" || {
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          }
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: Race-test security and persistence boundaries
        if: github.event_name != 'push'
        run: >-
          go test -race -count=1 -timeout=8m
          ./internal/auth
          ./internal/db
          ./internal/repositories
          ./internal/services
          ./internal/transport
          ./cmd/agent
      - name: Verify shell syntax
        run: git ls-files -z '*.sh' | xargs -0 -r bash -n
      - name: Verify POSIX download bootstrap syntax
        run: dash -n download-portal/get.sh
      # Keep the one-time pre-ledger release path fail-closed and ordered.
      # Tek seferlik pre-ledger sürüm yolunu fail-closed ve sıralı tut.
      - run: bash deploy/test-bootstrap-update-contract.sh
        if: github.event_name != 'push'
      # Keep the RHEL preview probe blocked-only, default-dry-run and injection-safe.
      - run: bash deploy/e2e/rhel9/test-contract.sh
        if: github.event_name != 'push'
      - run: bash deploy/test-install-localization-contract.sh
        if: github.event_name != 'push'
      - run: bash deploy/test-install-toolchain-contract.sh
        if: github.event_name != 'push'
      - run: bash deploy/test-release-publish-contract.sh
        if: github.event_name != 'push'
      - run: bash deploy/test-download-portal-contract.sh
        if: github.event_name != 'push'
      - run: sudo env PATH=$PATH GOTOOLCHAIN=local bash deploy/test-signed-release-manifest-contract.sh
        if: github.event_name != 'push'
      - run: sudo bash deploy/test-release-foundation-root-contract.sh
        if: github.event_name != 'push'
      - run: sudo bash deploy/test-signed-release-enrollment-contract.sh
        if: github.event_name != 'push'
      - run: bash deploy/test-release-updater-rollback-contract.sh
        if: github.event_name != 'push'
      - run: sudo bash deploy/test-download-portal-operation-selection.sh
        if: github.event_name != 'push'
      - run: sudo bash deploy/test-prebuilt-update-contract.sh
        if: github.event_name != 'push'
      - run: bash deploy/test-go-toolchain-contract.sh
        if: github.event_name != 'push'
      - run: sudo bash deploy/test-go-toolchain-migration-contract.sh
        if: github.event_name != 'push'
      - run: bash deploy/test-schema17-bridge-contract.sh
        if: github.event_name != 'push'
      # Keep persistent release markers and controlled systemd starts fail-closed.
      # Kalıcı sürüm işaretçilerini ve kontrollü systemd başlangıçlarını fail-closed tut.
      - run: sudo bash deploy/test-release-transaction-guard.sh
        if: github.event_name != 'push'
      - run: bash deploy/test-finalize-pending-update-contract.sh
        if: github.event_name != 'push'
      - run: sudo bash deploy/test-panel-tls-snapshot-contract.sh
        if: github.event_name != 'push'
      - run: bash deploy/test-abort-pre-mutation-active-update-contract.sh
        if: github.event_name != 'push'
      - run: sudo bash deploy/test-abort-pre-mutation-active-update-behavior.sh
        if: github.event_name != 'push'
      - run: bash deploy/test-recover-active-update-database-contract.sh
        if: github.event_name != 'push'
      # Prove exact coordinator identity and crash-safe quiesce recovery.
      # Tam koordinatör kimliğini ve çökme güvenli quiesce kurtarmasını kanıtla.
      - run: bash deploy/test-update-quiesce-exit-contract.sh update.sh
        if: github.event_name != 'push'

  panel-race:
    name: Panel race — ${{ matrix.shard }}
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: A through G
            pattern: '^Test($|[A-G]|[^A-Z])'
          - shard: H through M
            pattern: '^Test[H-M]'
          - shard: N through R
            pattern: '^Test[N-R]'
          - shard: S
            pattern: '^TestS'
          - shard: T through Z
            pattern: '^Test[T-Z]'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
      - name: Verify exact Go toolchain
        run: test "$(go env GOVERSION)" = go1.26.5
      # cmd/panel has hundreds of SQLite-backed tests. These five matrix
      # entries run concurrently, are disjoint and cover every valid Test*
      # suffix, including a future exact `Test` name or non-uppercase suffix.
      - name: Race-test panel boundaries
        run: >-
          go test -race -count=1 -timeout=8m ./cmd/panel
          -run '${{ matrix.pattern }}'

  linux-arm64-compile:
    name: Platform portability - Linux arm64 compile only
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    env:
      GOOS: linux
      GOARCH: arm64
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
      - name: Verify exact Go toolchain
        run: test "$(go env GOVERSION)" = go1.26.5
      - name: Cross-compile all production packages
        run: go build ./...

  web:
    name: Web — typecheck & build
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      # npm's install-time audit sends the dependency graph to the configured
      # registry. Keep CI deterministic and non-disclosing; a networked audit
      # is a separate, explicitly authorised release-review action.
      - run: npm ci --no-audit --no-fund
      # Run every UI contract: routing, tenant authorization, mailbox secrets,
      # webmail fail-closed behavior, API errors and provider boundaries.
      - run: npm test
      # `build` is `tsc && vite build` — tsc is the typecheck gate, so a type
      # error (e.g. the capabilities bool/string class of bug) fails CI here.
      # `build` = `tsc && vite build` — tsc tip denetimi kapısıdır; bir tip
      # hatası (örn. capabilities bool/string hata sınıfı) CI'ı burada düşürür.
      - run: npm run build

  package:
    name: Release — reproducible archive and checksum
    runs-on: ubuntu-latest
    needs: [go, panel-race, web, linux-arm64-compile]
    if: >-
      always() &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.go.result == 'success' &&
          needs.panel-race.result == 'skipped' &&
          needs.web.result == 'success' &&
          needs.linux-arm64-compile.result == 'success'
        )
      )
    outputs:
      release_version: ${{ steps.release_version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - name: Select immutable artifact version
        id: release_version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            version="${GITHUB_REF_NAME}"
            [[ "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$ ]] || {
              printf 'release tag is not valid semver: %s\n' "$version" >&2
              exit 1
            }
            prerelease=${version#*-}
            if [[ "$prerelease" != "$version" ]]; then
              IFS=. read -r -a identifiers <<< "$prerelease"
              for identifier in "${identifiers[@]}"; do
                if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" != 0 && "$identifier" == 0* ]]; then
                  printf 'release tag has a non-canonical numeric prerelease identifier: %s\n' "$version" >&2
                  exit 1
                fi
              done
            fi
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            [[ "$(git rev-parse refs/remotes/origin/main)" == "${GITHUB_SHA}" ]] || {
              printf 'release tag must point to the current main commit\n' >&2
              exit 1
            }
          else
            version="${GITHUB_SHA}"
          fi
          [[ "$version" =~ ^[A-Za-z0-9._-]+$ ]] || {
            printf 'unsafe release version: %s\n' "$version" >&2
            exit 1
          }
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Verify exact successful main CI provenance
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f status=success -f per_page=100)
          jq -e --arg sha "${GITHUB_SHA}" \
            '.workflow_runs | any(.head_sha == $sha and .conclusion == "success")' \
            <<< "$runs" >/dev/null || {
              printf 'release tag commit has no successful main CI run: %s\n' \
                "${GITHUB_SHA}" >&2
              exit 1
            }
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
      - name: Verify exact Go toolchain
        run: test "$(go env GOVERSION)" = go1.26.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the exact commit release archive
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.value }}
        run: |
          source_date_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          umask 022
          make dist VERSION="${RELEASE_VERSION}" COMMIT="${GITHUB_SHA}" SOURCE_DATE_EPOCH="$source_date_epoch"
      - name: Rebuild and compare the release archive
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.value }}
        run: |
          archive="dist/celikpanel-${RELEASE_VERSION}.tar.gz"
          first="$(sha256sum "$archive" | awk '{print $1}')"
          source_date_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          umask 077
          make dist VERSION="${RELEASE_VERSION}" COMMIT="${GITHUB_SHA}" SOURCE_DATE_EPOCH="$source_date_epoch"
          second="$(sha256sum "$archive" | awk '{print $1}')"
          test "$first" = "$second" || {
            printf 'release archive is not reproducible: %s != %s\n' "$first" "$second"
            exit 1
          }
      - name: Verify the external release checksum
        working-directory: dist
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.value }}
        run: sha256sum -c "celikpanel-${RELEASE_VERSION}.tar.gz.sha256"
      - name: Build optional operator-authorized signed linux/amd64 assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.value }}
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.CELIKPANEL_RELEASE_SIGNING_ED25519_PEM }}
          RELEASE_SEQUENCE: ${{ vars.CELIKPANEL_RELEASE_SEQUENCE }}
        run: |
          if [[ -z "${RELEASE_SIGNING_PRIVATE_KEY}" ]]; then
            printf '%s\n' 'signed assets skipped: release signing key is not configured'
            exit 0
          fi
          [[ "${RELEASE_SEQUENCE}" =~ ^[1-9][0-9]*$ ]] || {
            printf '%s\n' 'CELIKPANEL_RELEASE_SEQUENCE must be configured when the signing key is present' >&2
            exit 1
          }
          source_archive="dist/celikpanel-${RELEASE_VERSION}.tar.gz"
          platform_archive="dist/celikpanel-${RELEASE_VERSION}-linux-amd64.tar.gz"
          platform_checksum="${platform_archive}.sha256"
          cp -- "$source_archive" "$platform_archive"
          cmp -s -- "$source_archive" "$platform_archive"
          (cd dist && sha256sum "$(basename -- "$platform_archive")" > "$(basename -- "$platform_checksum")")
          key_file=$(mktemp "${RUNNER_TEMP}/celikpanel-release-key.XXXXXXXX")
          sign_dir=$(mktemp -d "${RUNNER_TEMP}/celikpanel-release-sign.XXXXXXXX")
          cleanup_signing() { rm -rf -- "$key_file" "$sign_dir"; }
          trap cleanup_signing EXIT HUP INT TERM
          printf '%s' "$RELEASE_SIGNING_PRIVATE_KEY" > "$key_file"
          chmod 0600 "$key_file"
          CELIKPANEL_RELEASE_SIGNING_KEY_FILE="$key_file" \
            bash deploy/write-signed-release-manifest.sh \
              "$RELEASE_VERSION" "$RELEASE_SEQUENCE" "$GITHUB_SHA" \
              "$(date -u -d "@$(git show -s --format=%ct "$GITHUB_SHA")" +%Y-%m-%dT%H:%M:%SZ)" \
              linux amd64 "$platform_archive" "$sign_dir"
          mv -- "$sign_dir/release-manifest-v2" \
            "dist/celikpanel-${RELEASE_VERSION}-linux-amd64.release-manifest-v2"
          mv -- "$sign_dir/release-manifest-v2.sig" \
            "dist/celikpanel-${RELEASE_VERSION}-linux-amd64.release-manifest-v2.sig"
          cleanup_signing
          trap - EXIT HUP INT TERM
      - uses: actions/upload-artifact@v7
        with:
          name: celikpanel-${{ steps.release_version.outputs.value }}
          path: |
            dist/celikpanel-${{ steps.release_version.outputs.value }}.tar.gz
            dist/celikpanel-${{ steps.release_version.outputs.value }}.tar.gz.sha256
            dist/celikpanel-${{ steps.release_version.outputs.value }}-linux-amd64.tar.gz
            dist/celikpanel-${{ steps.release_version.outputs.value }}-linux-amd64.tar.gz.sha256
            dist/celikpanel-${{ steps.release_version.outputs.value }}-linux-amd64.release-manifest-v2
            dist/celikpanel-${{ steps.release_version.outputs.value }}-linux-amd64.release-manifest-v2.sig
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Release — publish permanent tag assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: celikpanel-${{ needs.package.outputs.release_version }}
          path: dist
      - name: Verify downloaded release bytes
        working-directory: dist
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.release_version }}
        run: sha256sum -c "celikpanel-${RELEASE_VERSION}.tar.gz.sha256"
      - name: Publish immutable GitHub release assets
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.package.outputs.release_version }}
        run: |
          archive="celikpanel-${RELEASE_VERSION}.tar.gz"
          checksum="${archive}.sha256"
          assets=("$archive" "$checksum")
          signed_archive="celikpanel-${RELEASE_VERSION}-linux-amd64.tar.gz"
          signed_checksum="${signed_archive}.sha256"
          signed_manifest="celikpanel-${RELEASE_VERSION}-linux-amd64.release-manifest-v2"
          signed_signature="${signed_manifest}.sig"
          signed_count=0
          for signed_asset in "$signed_archive" "$signed_checksum" "$signed_manifest" "$signed_signature"; do
            [[ ! -e "$signed_asset" ]] || signed_count=$((signed_count + 1))
          done
          [[ "$signed_count" -eq 0 || "$signed_count" -eq 4 ]] || {
            printf '%s\n' 'signed release asset set is incomplete' >&2
            exit 1
          }
          if [[ "$signed_count" -eq 4 ]]; then
            sha256sum -c "$signed_checksum"
            assets+=("$signed_archive" "$signed_checksum" "$signed_manifest" "$signed_signature")
          fi
          prerelease=()
          [[ "${GITHUB_REF_NAME}" =~ -(alpha|beta|rc) ]] && prerelease=(--prerelease)
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            printf 'release %s already exists; immutable assets will not be replaced\n' \
              "${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes \
            --title "CelikPanel ${GITHUB_REF_NAME}" "${prerelease[@]}"
