name: CI

# The honesty gate (AUTOPSY B5). The constitution says "it runs ≠ it's done"
# and demands tests+build before a change counts — yet for months nothing
# enforced even that the tree COMPILES. This is the floor: every push and PR
# must build (Go + web), vet clean, and pass the Go tests. Richer golden-path
# smoke (stub render, endpoint checks) layers on top of this later.
#
# Dürüstlük kapısı (AUTOPSY B5). Anayasa "çalışıyor ≠ bitti" der ve bir
# değişiklik sayılmadan önce test+derleme ister — ama aylarca ağacın DERLENDİĞİNİ
# bile hiçbir şey zorlamadı. Bu, taban: her push ve PR derlenmeli (Go + web),
# vet temiz olmalı ve Go testleri geçmeli. Daha zengin golden-path smoke
# (stub render, uç denetimleri) bunun üstüne sonra eklenir.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  GOTOOLCHAIN: local

jobs:
  go:
    name: Go — format, build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
      - name: Verify exact Go toolchain
        run: test "$(go env GOVERSION)" = go1.26.5
      - name: Verify Go formatting
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 -r gofmt -l)"
          test -z "$unformatted" || {
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          }
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: Race-test security and persistence boundaries
        run: >-
          go test -race -count=1 -timeout=8m
          ./internal/auth
          ./internal/db
          ./internal/repositories
          ./internal/services
          ./internal/transport
          ./cmd/agent
      # cmd/panel has hundreds of SQLite-backed tests. Running it beside all
      # other race packages causes CPU contention and can hit Go's default
      # package timeout even though no test is deadlocked. These two regexes
      # are disjoint and cover every valid Test* suffix, including a future
      # exact `Test` name or non-uppercase suffix in the first shard.
      - name: Race-test panel boundaries — A through M
        run: >-
          go test -race -count=1 -timeout=8m ./cmd/panel
          -run '^Test($|[A-M]|[^A-Z])'
      - name: Race-test panel boundaries — N through Z
        run: >-
          go test -race -count=1 -timeout=8m ./cmd/panel
          -run '^Test[N-Z]'
      - name: Verify shell syntax
        run: git ls-files -z '*.sh' | xargs -0 -r bash -n
      # Keep the one-time pre-ledger release path fail-closed and ordered.
      # Tek seferlik pre-ledger sürüm yolunu fail-closed ve sıralı tut.
      - run: bash deploy/test-bootstrap-update-contract.sh
      - run: bash deploy/test-install-localization-contract.sh
      - run: bash deploy/test-install-toolchain-contract.sh
      - run: bash deploy/test-release-publish-contract.sh
      - run: bash deploy/test-go-toolchain-contract.sh
      - run: sudo bash deploy/test-go-toolchain-migration-contract.sh
      - run: bash deploy/test-schema17-bridge-contract.sh
      # Keep persistent release markers and controlled systemd starts fail-closed.
      # Kalıcı sürüm işaretçilerini ve kontrollü systemd başlangıçlarını fail-closed tut.
      - run: sudo bash deploy/test-release-transaction-guard.sh
      - run: bash deploy/test-finalize-pending-update-contract.sh
      - run: sudo bash deploy/test-panel-tls-snapshot-contract.sh
      - run: bash deploy/test-abort-pre-mutation-active-update-contract.sh
      - run: bash deploy/test-recover-active-update-database-contract.sh
      # Prove exact coordinator identity and crash-safe quiesce recovery.
      # Tam koordinatör kimliğini ve çökme güvenli quiesce kurtarmasını kanıtla.
      - run: bash deploy/test-update-quiesce-exit-contract.sh update.sh

  windows-portability:
    name: Platform portability — Windows build and targeted tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
      - name: Verify exact Go toolchain
        shell: pwsh
        run: |
          if ((go env GOVERSION) -ne 'go1.26.5') {
            throw "unexpected Go toolchain: $(go env GOVERSION)"
          }
      - name: Build all production packages on Windows
        run: go build ./...
      - name: Test Windows and fail-closed ownership adapters
        run: |
          go test ./cmd/panel -run '^TestReadDiskWindowsReportsUsableValues$' -count=1
          go test ./cmd/agent -run '^TestRequireRootOwnerFailsClosedOnUnsupportedPlatform$' -count=1

  freebsd-compile:
    name: Platform portability — FreeBSD compile only
    runs-on: ubuntu-latest
    env:
      GOOS: freebsd
      GOARCH: amd64
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
      - name: Verify exact Go toolchain
        run: test "$(go env GOVERSION)" = go1.26.5
      - name: Cross-compile all production packages
        run: go build ./...

  darwin-compile:
    name: Platform portability — Darwin fallback compile only
    runs-on: ubuntu-latest
    env:
      GOOS: darwin
      GOARCH: amd64
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
      - name: Verify exact Go toolchain
        run: test "$(go env GOVERSION)" = go1.26.5
      - name: Cross-compile all production packages
        run: go build ./...
      - name: Compile the unsupported-disk fallback test
        run: go test -c -o "$RUNNER_TEMP/panel-darwin.test" ./cmd/panel

  web:
    name: Web — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      # npm's install-time audit sends the dependency graph to the configured
      # registry. Keep CI deterministic and non-disclosing; a networked audit
      # is a separate, explicitly authorised release-review action.
      - run: npm ci --no-audit --no-fund
      - run: npm run test:router
      # `build` is `tsc && vite build` — tsc is the typecheck gate, so a type
      # error (e.g. the capabilities bool/string class of bug) fails CI here.
      # `build` = `tsc && vite build` — tsc tip denetimi kapısıdır; bir tip
      # hatası (örn. capabilities bool/string hata sınıfı) CI'ı burada düşürür.
      - run: npm run build

  package:
    name: Release — reproducible archive and checksum
    runs-on: ubuntu-latest
    needs: [go, web, windows-portability, freebsd-compile, darwin-compile]
    outputs:
      release_version: ${{ steps.release_version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Select immutable artifact version
        id: release_version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            version="${GITHUB_REF_NAME}"
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
              printf 'release tag is not valid semver: %s\n' "$version" >&2
              exit 1
            }
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            [[ "$(git rev-parse refs/remotes/origin/main)" == "${GITHUB_SHA}" ]] || {
              printf 'release tag must point to the current main commit\n' >&2
              exit 1
            }
          else
            version="${GITHUB_SHA}"
          fi
          [[ "$version" =~ ^[A-Za-z0-9._-]+$ ]] || {
            printf 'unsafe release version: %s\n' "$version" >&2
            exit 1
          }
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
      - name: Verify exact Go toolchain
        run: test "$(go env GOVERSION)" = go1.26.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the exact commit release archive
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.value }}
        run: |
          source_date_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          umask 022
          make dist VERSION="${RELEASE_VERSION}" COMMIT="${GITHUB_SHA}" SOURCE_DATE_EPOCH="$source_date_epoch"
      - name: Rebuild and compare the release archive
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.value }}
        run: |
          archive="dist/celikpanel-${RELEASE_VERSION}.tar.gz"
          first="$(sha256sum "$archive" | awk '{print $1}')"
          source_date_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          umask 077
          make dist VERSION="${RELEASE_VERSION}" COMMIT="${GITHUB_SHA}" SOURCE_DATE_EPOCH="$source_date_epoch"
          second="$(sha256sum "$archive" | awk '{print $1}')"
          test "$first" = "$second" || {
            printf 'release archive is not reproducible: %s != %s\n' "$first" "$second"
            exit 1
          }
      - name: Verify the external release checksum
        working-directory: dist
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.value }}
        run: sha256sum -c "celikpanel-${RELEASE_VERSION}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: celikpanel-${{ steps.release_version.outputs.value }}
          path: |
            dist/celikpanel-${{ steps.release_version.outputs.value }}.tar.gz
            dist/celikpanel-${{ steps.release_version.outputs.value }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Release — publish permanent tag assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: celikpanel-${{ needs.package.outputs.release_version }}
          path: dist
      - name: Verify downloaded release bytes
        working-directory: dist
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.release_version }}
        run: sha256sum -c "celikpanel-${RELEASE_VERSION}.tar.gz.sha256"
      - name: Publish immutable GitHub release assets
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.package.outputs.release_version }}
        run: |
          archive="celikpanel-${RELEASE_VERSION}.tar.gz"
          checksum="${archive}.sha256"
          prerelease=()
          [[ "${GITHUB_REF_NAME}" =~ -(alpha|beta|rc) ]] && prerelease=(--prerelease)
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            printf 'release %s already exists; immutable assets will not be replaced\n' \
              "${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" "$archive" "$checksum" \
            --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes \
            --title "CelikPanel ${GITHUB_REF_NAME}" "${prerelease[@]}"
