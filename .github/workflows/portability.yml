name: Optional portability

# CelikPanel is shipped for Linux servers. These unsupported-target compile
# checks are retained for deliberate portability work, but never consume
# Actions minutes or delay ordinary PRs/releases unless an operator starts
# them explicitly.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  windows-portability:
    name: Windows build and targeted tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
      - name: Verify exact Go toolchain
        shell: pwsh
        run: |
          if ((go env GOVERSION) -ne 'go1.26.5') {
            throw "unexpected Go toolchain: $(go env GOVERSION)"
          }
      - name: Build all production packages on Windows
        run: go build ./...
      - name: Test Windows and fail-closed ownership adapters
        run: |
          go test ./cmd/panel -run '^TestReadDiskWindowsReportsUsableValues$' -count=1
          go test ./cmd/agent -run '^TestRequireRootOwnerFailsClosedOnUnsupportedPlatform$' -count=1

  freebsd-compile:
    name: FreeBSD compile only
    runs-on: ubuntu-latest
    env:
      GOOS: freebsd
      GOARCH: amd64
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
      - name: Verify exact Go toolchain
        run: test "$(go env GOVERSION)" = go1.26.5
      - name: Cross-compile all production packages
        run: go build ./...

  darwin-compile:
    name: Darwin fallback compile only
    runs-on: ubuntu-latest
    env:
      GOOS: darwin
      GOARCH: amd64
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
      - name: Verify exact Go toolchain
        run: test "$(go env GOVERSION)" = go1.26.5
      - name: Cross-compile all production packages
        run: go build ./...
      - name: Compile the unsupported-disk fallback test
        run: go test -c -o "$RUNNER_TEMP/panel-darwin.test" ./cmd/panel
